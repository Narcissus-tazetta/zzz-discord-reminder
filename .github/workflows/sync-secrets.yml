name: Sync secrets to Cloudflare

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Put secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8cccd37f8611ab68926721072c2ae958
          LTUID_V2: ${{ secrets.LTUID_V2 }}
          LTOKEN_V2: ${{ secrets.LTOKEN_V2 }}
          COOKIE_TOKEN_V2: ${{ secrets.COOKIE_TOKEN_V2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ZZZ_TARGET_UID: ${{ vars.ZZZ_TARGET_UID }}
        # 未設定の値を空文字で登録しないよう、値があるものだけ JSON にして一括登録する
        run: |
          jq -n 'env | with_entries(select(.key | IN("LTUID_V2","LTOKEN_V2","COOKIE_TOKEN_V2","DISCORD_WEBHOOK_URL","ZZZ_TARGET_UID")) | select(.value != ""))' \
            | bunx wrangler secret bulk
