name: ZZZ Daily Reminder

on:
  schedule:
    # UTC時刻で指定する。現在は 14:30 UTC = 23:30 JST。
    # 時間を変えたいときはここの数字を編集するだけでOK(JST = UTC + 9)。
    - cron: "30 14 * * *"
  workflow_dispatch: {} # 手動実行用(テストしたいときに「Run workflow」ボタンで叩ける)

jobs:
  check-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check ZZZ daily commission
        env:
          LTUID_V2: ${{ secrets.LTUID_V2 }}
          LTOKEN_V2: ${{ secrets.LTOKEN_V2 }}
          COOKIE_TOKEN_V2: ${{ secrets.COOKIE_TOKEN_V2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ZZZ_TARGET_UID: ${{ vars.ZZZ_TARGET_UID }}
        run: python check_daily.py
