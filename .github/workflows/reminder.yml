name: ZZZ Reminder

on:
  schedule:
    # UTC時刻で指定する。時間を変えたいときはここの数字を編集するだけでOK(JST = UTC + 9)。
    #
    # 毎正時・30分ちょうどはGitHub Actionsのcronが混雑して起動が数時間遅れることがある。
    # 半端な分を指定して混雑を避ける。
    #
    # 毎日 14:37 UTC = 毎日 23:37 JST … デイリー任務(委托)のチェック
    - cron: "37 14 * * *"
    # 毎週日曜 14:07 UTC = 日曜 23:07 JST … 0号ホロウの懸賞依頼(週間)のチェック
    # 懸賞依頼は月曜 5:00 JST にリセットされるので、その約6時間前に催促する。
    - cron: "7 14 * * 0"
  workflow_dispatch: # 手動実行用(テストしたいときに「Run workflow」ボタンで叩ける)
    inputs:
      mode:
        description: "チェック対象"
        type: choice
        options:
          - both
          - daily
          - weekly
        default: both

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check ZZZ tasks
        env:
          LTUID_V2: ${{ secrets.LTUID_V2 }}
          LTOKEN_V2: ${{ secrets.LTOKEN_V2 }}
          COOKIE_TOKEN_V2: ${{ secrets.COOKIE_TOKEN_V2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ZZZ_TARGET_UID: ${{ vars.ZZZ_TARGET_UID }}
          # 手動実行なら選んだmode、cron実行ならどのcronで起動したかで判定する
          ZZZ_CHECK_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 14 * * 0' && 'weekly' || 'daily') }}
        run: python check_daily.py
